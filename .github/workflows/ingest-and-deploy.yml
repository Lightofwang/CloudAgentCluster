name: Ingest Hackathon Spec and Deploy Hub

on:
  issues:
    types: [opened, edited, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_slug:
        description: "可选：输入比赛 slug 将其状态重置为 pending_dev 重新排队开发"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "hub-ingest-and-pages"
  cancel-in-progress: false

jobs:
  reject-unauthorized:
    if: >
      github.event_name == 'issues' &&
      github.event.issue.user.login != 'Lightofwang' &&
      (contains(github.event.issue.labels.*.name, 'hackathon-spec') ||
       contains(github.event.issue.labels.*.name, 'trigger-dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Close unauthorized issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⛔ 已拦截：此自动化入库通道仅限仓库所有者 (`Lightofwang`) 提交。外部访客请 Fork 本仓库后自行部署使用。"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

  ingest:
    if: >
      github.actor == 'Lightofwang' &&
      (
        (github.event_name == 'issues' &&
         github.event.issue.user.login == 'Lightofwang' &&
         (contains(github.event.issue.labels.*.name, 'hackathon-spec') ||
          contains(github.event.issue.labels.*.name, 'trigger-dev'))) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.reset_slug != '')
      )
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.run_ingest.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest Spec/Plan or Reset Queue
        id: run_ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          HUB_PASSCODE: ${{ secrets.HUB_PASSCODE }}
          RESET_SLUG: ${{ github.event.inputs.reset_slug }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          actor = os.environ.get("GITHUB_ACTOR_NAME", "").strip()
          reset_slug = os.environ.get("RESET_SLUG", "").strip()
          if reset_slug:
              res = subprocess.check_output(
                  ["python3", "scripts/ingest_spec.py", "--reset-slug", reset_slug, "--actor", actor],
                  text=True,
              )
          else:
              body_file = Path("/tmp/issue_body.md")
              body_file.write_text(os.environ.get("ISSUE_BODY", ""), encoding="utf-8")
              issue_user = os.environ.get("ISSUE_USER", "").strip() or actor
              res = subprocess.check_output(
                  [
                      "python3",
                      "scripts/ingest_spec.py",
                      "--issue-body-file",
                      str(body_file),
                      "--issue-title",
                      os.environ.get("ISSUE_TITLE", ""),
                      "--actor",
                      issue_user,
                      "--require-auth",
                  ],
                  text=True,
              )
          data = json.loads(res)
          slug = data["entry"]["slug"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"slug={slug}\n")
          print(res)
          PY

      - name: Commit and push updated hub data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(hub): ingest/update hackathon '${{ steps.run_ingest.outputs.slug }}'"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Comment back on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const slug = "${{ steps.run_ingest.outputs.slug }}";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const siteUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `✅ 已完成零 API 自动入库！\n\n- **Slug**: \`${slug}\`\n- **当前状态**: \`pending_dev\`（等待 Antigravity 定时读取并开发）\n- **中转网站看板**: ${siteUrl}\n- **Spec 直链**: \`${siteUrl}data/specs/${slug}/spec.md\``
            });

  deploy-pages:
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inject HUB_PASSCODE SHA-256 hash into frontend
        env:
          HUB_PASSCODE: ${{ secrets.HUB_PASSCODE }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          from pathlib import Path

          run_id = os.environ.get("RUN_ID", "latest").strip() or "latest"
          secret = os.environ.get("HUB_PASSCODE", "").strip()
          if secret:
              digest = hashlib.sha256(secret.encode("utf-8")).hexdigest()
              app_js = Path("site/assets/app.js")
              content = app_js.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r'(const\s+EXPECTED_PASSCODE_HASH\s*=\s*")([a-f0-9]{64})(")',
                  rf"\g<1>{digest}\g<3>",
                  content,
              )
              if count != 1:
                  raise RuntimeError(f"Expected 1 EXPECTED_PASSCODE_HASH replacement, got {count}")
              app_js.write_text(updated, encoding="utf-8")
              print("Injected SHA-256 hash from secrets.HUB_PASSCODE into site/assets/app.js")
          else:
              print("secrets.HUB_PASSCODE is not set; using default hash in site/assets/app.js")

          for html_name in ("site/index.html", "site/submit.html"):
              html_path = Path(html_name)
              html_text = html_path.read_text(encoding="utf-8")
              html_updated = re.sub(
                  r'assets/app\.js(\?v=[^"]*)?',
                  f"assets/app.js?v={run_id}",
                  html_text,
              )
              html_path.write_text(html_updated, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
