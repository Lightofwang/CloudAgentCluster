name: Ingest Hackathon Spec and Deploy Hub

on:
  issues:
    types: [opened, edited, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_slug:
        description: "可选：输入比赛 slug 将其状态重置为 pending_dev 重新排队开发"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "hub-ingest-and-pages"
  cancel-in-progress: false

jobs:
  ingest:
    if: >
      (github.event_name == 'issues' &&
       (contains(github.event.issue.labels.*.name, 'hackathon-spec') ||
        contains(github.event.issue.labels.*.name, 'trigger-dev'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.reset_slug != '')
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.run_ingest.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest Spec/Plan or Reset Queue
        id: run_ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RESET_SLUG: ${{ github.event.inputs.reset_slug }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          reset_slug = os.environ.get("RESET_SLUG", "").strip()
          if reset_slug:
              res = subprocess.check_output(
                  ["python3", "scripts/ingest_spec.py", "--reset-slug", reset_slug],
                  text=True,
              )
          else:
              body_file = Path("/tmp/issue_body.md")
              body_file.write_text(os.environ.get("ISSUE_BODY", ""), encoding="utf-8")
              res = subprocess.check_output(
                  [
                      "python3",
                      "scripts/ingest_spec.py",
                      "--issue-body-file",
                      str(body_file),
                      "--issue-title",
                      os.environ.get("ISSUE_TITLE", ""),
                  ],
                  text=True,
              )
          data = json.loads(res)
          slug = data["entry"]["slug"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"slug={slug}\n")
          print(res)
          PY

      - name: Commit and push updated hub data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(hub): ingest/update hackathon '${{ steps.run_ingest.outputs.slug }}'"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Comment back on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const slug = "${{ steps.run_ingest.outputs.slug }}";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const siteUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `✅ 已完成零 API 自动入库！\n\n- **Slug**: \`${slug}\`\n- **当前状态**: \`pending_dev\`（等待 Antigravity 定时读取并开发）\n- **中转网站看板**: ${siteUrl}\n- **Spec 直链**: \`${siteUrl}data/specs/${slug}/spec.md\``
            });

  deploy-pages:
    needs: ingest
    if: always() && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
